services:
  mysql:
    image: mysql:8.0
    container_name: tracken_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tracken
      MYSQL_USER: tracken
      MYSQL_PASSWORD: tracken
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - tracken_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tracken_mysql_data:
